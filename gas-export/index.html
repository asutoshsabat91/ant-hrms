<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AntBox HRMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f8f8;--sidebar:#0f0f0f;--white:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;--radius:12px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
#sidebar{position:fixed;top:0;left:0;width:220px;height:100vh;background:var(--sidebar);display:flex;flex-direction:column;z-index:100}
.logo-wrap{padding:20px 18px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:10px}
.logo-box{width:34px;height:34px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#000;letter-spacing:-1px;flex-shrink:0}
.logo-text{color:#fff;font-size:15px;font-weight:600}
.nav-section{padding:14px 18px 4px;font-size:10px;font-weight:600;color:#3d3d3d;letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;color:#9ca3af;cursor:pointer;font-size:13px;font-weight:500;transition:color .15s,background .15s;position:relative}
.nav-item:hover{color:#fff;background:#1a1a1a}
.nav-item.active{color:#fff}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#fff;border-radius:0 2px 2px 0}
.nav-item .ni{width:16px;font-size:13px;text-align:center}
.sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid #1a1a1a}
.sidebar-user{color:#777;font-size:11px;line-height:1.6}
#topbar{position:fixed;top:0;left:220px;right:0;height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:99}
.tb-left h2{font-size:16px;font-weight:700}
.tb-left p{font-size:12px;color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:12px}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;width:220px}
.search-wrap input{border:none;background:none;font-size:13px;outline:none;width:100%;color:var(--text)}
.notif-btn{position:relative;width:36px;height:36px;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.notif-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}
.user-chip{display:flex;align-items:center;gap:9px;padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer}
.user-av{width:28px;height:28px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.user-nm{font-size:12px;font-weight:600}
.user-rl{font-size:10px;color:var(--muted)}
#main{margin-left:220px;margin-top:60px;padding:28px;min-height:calc(100vh - 60px)}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{padding:14px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.stat-val{font-size:30px;font-weight:800;color:var(--text)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:5px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.ph h1{font-size:22px;font-weight:700}
.ph p{font-size:13px;color:var(--muted);margin-top:2px}
.ph-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:#111;color:#fff}.btn-primary:hover{background:#333}
.btn-secondary{background:#fff;color:#111;border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg)}
.btn-success{background:#dcfce7;color:#15803d}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-sm{padding:5px 10px;font-size:12px}
.tw{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:#fff}
thead th{background:#fafafa;padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
tbody td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafafa}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:#f3f4f6;color:#374151}
.bgn{background:#dcfce7;color:#15803d}
.bgr{background:#fee2e2;color:#dc2626}
.bgb{background:#dbeafe;color:#1d4ed8}
.bgy{background:#fef9c3;color:#854d0e}
.bgp{background:#f3e8ff;color:#6b21a8}
.fgg{display:flex;flex-direction:column;gap:5px}
.fgg label{font-size:12px;font-weight:600}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg-full{grid-column:1/-1}
input,select,textarea{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#111}
textarea{resize:vertical;min-height:70px}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:#fff;border-radius:var(--radius);width:600px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:15px;font-weight:700}
.mclose{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.progress{height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden}
.pbar{height:100%;background:#111;border-radius:3px;transition:width .3s}
.pbar-g{background:#16a34a}
.pbar-b{background:#2563eb}
.emp-av{width:36px;height:36px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.clock-card{background:linear-gradient(135deg,#0f0f0f,#1f1f1f);border-radius:var(--radius);padding:22px;color:#fff}
.clock-time{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.clock-btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px;transition:all .2s}
.btn-in{background:#22c55e;color:#fff}
.btn-out{background:#f97316;color:#fff}
.tabs{display:flex;gap:2px;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:18px;width:fit-content}
.tab{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.tab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);background:#fafafa}
.cal-dh{padding:8px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:82px;padding:6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:#fff}
.cal-cell:nth-child(7n){border-right:none}
.cal-num{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:3px}
.today-cell .cal-num{background:#111;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.cal-evt{font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif-panel{position:fixed;top:60px;right:0;width:330px;height:calc(100vh - 60px);background:#fff;border-left:1px solid var(--border);z-index:150;transform:translateX(100%);transition:transform .2s;overflow-y:auto}
.notif-panel.open{transform:translateX(0)}
.notif-ph{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.notif-item{padding:13px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{border-left:3px solid var(--blue)}
.ni-title{font-size:13px;font-weight:600;margin-bottom:2px}
.ni-msg{font-size:12px;color:var(--muted)}
.spinner{width:20px;height:20px;border:2px solid #e5e7eb;border-top-color:#111;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.pg-load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:10px;color:var(--muted);font-size:13px}
#toast-cnt{position:fixed;bottom:22px;right:22px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);animation:si .2s ease;display:flex;align-items:center;gap:8px;min-width:260px}
.ts{background:#111}.te{background:#dc2626}.ti{background:#2563eb}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ei{font-size:38px;margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px}
.pr-hero{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;align-items:center;gap:18px;margin-bottom:18px}
.pr-av{width:68px;height:68px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.pr-nm{font-size:20px;font-weight:700}
.pr-sub{font-size:13px;color:var(--muted);margin-top:2px}
.info-row2{padding:10px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.ir-lbl{font-size:12px;font-weight:600;color:var(--muted)}
.ir-val{font-size:13px}
.payslip{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.ps-hdr{background:#111;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.pay-row{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-bottom:1px solid var(--border)}
.pay-row:last-child{border-bottom:none}
.pay-total{background:#f9fafb;font-weight:700}
.pay-net{background:#111;color:#fff;font-size:15px;font-weight:700}
.task-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff}
.tchk{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.tchk.done{background:#111;border-color:#111;color:#fff;font-size:10px}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="logo-wrap">
    <div class="logo-box">ānt</div>
    <div class="logo-text">antbox</div>
  </div>
  <div style="overflow-y:auto;flex:1">
    <div class="nav-section">Workspace</div>
    <div class="nav-item active" id="nav-dashboard" onclick="go('dashboard')"><span class="ni">⊞</span>Dashboard</div>
    <div class="nav-item" id="nav-employees" onclick="go('employees')"><span class="ni">👥</span>Employees</div>
    <div class="nav-item" id="nav-onboarding" onclick="go('onboarding')"><span class="ni">🚀</span>Onboarding</div>
    <div class="nav-item" id="nav-separation" onclick="go('separation')"><span class="ni">📤</span>Separation</div>
    <div class="nav-item" id="nav-offboarding" onclick="go('offboarding')"><span class="ni">🔄</span>Offboarding</div>
    <div class="nav-section">People</div>
    <div class="nav-item" id="nav-attendance" onclick="go('attendance')"><span class="ni">🕐</span>Attendance</div>
    <div class="nav-item" id="nav-leave" onclick="go('leave')"><span class="ni">🌴</span>Leave</div>
    <div class="nav-item" id="nav-payroll" onclick="go('payroll')"><span class="ni">💰</span>Payroll</div>
    <div class="nav-item" id="nav-documents" onclick="go('documents')"><span class="ni">📄</span>Documents</div>
    <div class="nav-item" id="nav-reimbursements" onclick="go('reimbursements')"><span class="ni">🧾</span>Reimbursements</div>
    <div class="nav-section">More</div>
    <div class="nav-item" id="nav-calendar" onclick="go('calendar')"><span class="ni">📅</span>Calendar</div>
    <div class="nav-item" id="nav-reports" onclick="go('reports')"><span class="ni">📊</span>Reports</div>
    <div class="nav-item" id="nav-settings" onclick="go('settings')"><span class="ni">⚙️</span>Settings</div>
  </div>
  <div class="sidebar-foot">
    <div class="sidebar-user" id="sb-user">Loading...</div>
    <div class="nav-item" id="nav-portal" onclick="go('portal')" style="padding:8px 0;margin-top:6px"><span class="ni">👤</span>My Portal</div>
  </div>
</nav>

<div id="topbar">
  <div class="tb-left"><h2 id="pg-title">Dashboard</h2><p id="pg-date"></p></div>
  <div class="tb-right">
    <div class="search-wrap"><span>🔍</span><input type="text" placeholder="Search employees..." id="gsearch" oninput="gSearch(this.value)"/></div>
    <div class="notif-btn" onclick="toggleNotif()">🔔<span class="notif-badge" id="nb">0</span></div>
    <div class="user-chip" onclick="go('portal')">
      <div class="user-av" id="tb-av">?</div>
      <div><div class="user-nm" id="tb-nm">Loading</div><div class="user-rl" id="tb-rl">—</div></div>
    </div>
  </div>
</div>

<div class="notif-panel" id="notif-panel">
  <div class="notif-ph"><strong style="font-size:14px">Notifications</strong><button class="btn btn-sm btn-secondary" onclick="markRead()">Mark all read</button></div>
  <div id="notif-list"><div class="pg-load"><div class="spinner"></div></div></div>
</div>

<div id="main"><div class="pg-load"><div class="spinner"></div><span>Loading AntBox HRMS...</span></div></div>

<div class="modal-ov" id="mov"><div class="modal" id="mbox"><div class="mh"><h3 id="mt">—</h3><button class="mclose" onclick="cM()">✕</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div id="toast-cnt"></div>

<script>
var S={user:null,page:'dashboard',cal:{m:new Date().getMonth()+1,y:new Date().getFullYear()},leaveTab:'my',attTab:'my',payTab:'runs',repTab:'headcount'};
var TITLES={dashboard:'Dashboard',employees:'Employees',onboarding:'Onboarding',separation:'Separation',offboarding:'Offboarding',attendance:'Attendance',leave:'Leave Management',payroll:'Payroll',documents:'Documents',reimbursements:'Reimbursements',calendar:'Calendar',reports:'Reports',settings:'Settings',portal:'My Portal'};

window.onload=function(){
  document.getElementById('pg-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  loadDash();
};

function isA(){return S.user&&['SUPER_ADMIN','HR_ADMIN'].indexOf(S.user.role)>-1;}
function isM(){return S.user&&['SUPER_ADMIN','HR_ADMIN','MANAGER'].indexOf(S.user.role)>-1;}

function go(p){
  S.page=p;
  document.querySelectorAll('.nav-item').forEach(function(e){e.classList.remove('active');});
  var n=document.getElementById('nav-'+p);if(n)n.classList.add('active');
  document.getElementById('pg-title').textContent=TITLES[p]||p;
  C('<div class="pg-load"><div class="spinner"></div></div>');
  if(p==='dashboard')loadDash();
  else if(p==='employees')loadEmps();
  else if(p==='onboarding')loadOB();
  else if(p==='separation')loadSep();
  else if(p==='offboarding')loadOff();
  else if(p==='attendance')loadAtt();
  else if(p==='leave')loadLeave();
  else if(p==='payroll')loadPay();
  else if(p==='documents')loadDocs();
  else if(p==='reimbursements')loadRmb();
  else if(p==='calendar')loadCal();
  else if(p==='reports')loadRep();
  else if(p==='settings')loadSet();
  else if(p==='portal')loadPortal();
}

// ── DASHBOARD ──────────────────────────────────────────────
function loadDash(){google.script.run.withSuccessHandler(renderDash).withFailureHandler(err).getDashboardData();}
function renderDash(d){
  S.user=d.user;setUser(d.user);loadNotifs();
  var s=d.stats;
  var balH=d.myBalances.map(function(b){
    var p=b.allocated>0?Math.round(b.used/b.allocated*100):0;
    return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:500">'+b.name+'</span><span style="font-size:12px;color:var(--muted)">'+b.remaining+' / '+b.allocated+' left</span></div><div class="progress"><div class="pbar pbar-b" style="width:'+p+'%"></div></div></div>';
  }).join('');
  var holH=d.upcomingHolidays.length?d.upcomingHolidays.map(function(h){return '<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px">'+h.name+'</span><span style="font-size:12px;color:var(--muted)">'+fd(h.date)+'</span></div>';}).join(''):'<p style="color:var(--muted);font-size:13px">No upcoming holidays</p>';
  var ck=d.myToday?'<div style="margin-top:10px;font-size:12px;color:rgba(255,255,255,.6)">Today: In '+d.myToday.firstIn+(d.myToday.lastOut?' → Out '+d.myToday.lastOut:' (still in)')+'</div>':'';
  C(
  '<div class="grid4">'+sc('👥','Total Employees',s.total,'+'+s.onboarding+' onboarding')+sc('✅','Present Today',s.todayPresent,s.attendanceRate+'% attendance')+sc('🌴','Pending Leave',s.pendingLeave,'Awaiting approval')+sc('🚀','Onboarding',s.onboarding,s.offboarding+' offboarding')+'</div>'+
  '<div style="display:grid;grid-template-columns:1fr 330px;gap:18px">'+
    '<div>'+
      '<div class="clock-card">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
          '<div><div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:4px;letter-spacing:.06em">ATTENDANCE</div><div class="clock-time" id="lc">--:--:--</div></div>'+
          '<div style="text-align:right;font-size:12px;color:rgba(255,255,255,.5)">'+d.today+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:rgba(255,255,255,.5)"><span style="width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block"></span>Requires GPS · 200m of AntBox Bhubaneswar office</div>'+
        '<button class="clock-btn btn-in" id="ck-btn" onclick="doClock()">→ Clock In</button>'+
        ck+
      '</div>'+
      '<div class="card" style="margin-top:16px"><div style="font-size:13px;font-weight:700;margin-bottom:14px">Leave Balances</div>'+balH+'</div>'+
    '</div>'+
    '<div>'+
      '<div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;margin-bottom:11px">Upcoming Holidays</div>'+holH+'</div>'+
      '<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:11px">Quick Actions</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px">'+
          '<button class="btn btn-secondary" style="justify-content:flex-start" onclick="openApplyLeave()">🌴 Apply for Leave</button>'+
          '<button class="btn btn-secondary" style="justify-content:flex-start" onclick="go(\'reimbursements\')">🧾 Submit Expense Claim</button>'+
          (isA()?'<button class="btn btn-secondary" style="justify-content:flex-start" onclick="openAddEmp()">➕ Add Employee</button>':'')+
          (isA()?'<button class="btn btn-secondary" style="justify-content:flex-start" onclick="openNewOB()">🚀 New Onboarding</button>':'')+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>');
  startClock();
  if(d.myToday&&!d.myToday.lastOut){var b=document.getElementById('ck-btn');if(b){b.textContent='→ Clock Out';b.className='clock-btn btn-out';}}
}
function sc(ic,lbl,val,sub){return '<div class="stat-card"><div style="font-size:22px;margin-bottom:6px">'+ic+'</div><div class="stat-label">'+lbl+'</div><div class="stat-val">'+val+'</div><div class="stat-sub">'+sub+'</div></div>';}

function loadCal(){google.script.run.withSuccessHandler(renderCal).withFailureHandler(err).getCalendarData(S.cal.m,S.cal.y);}
function renderCal(data){
  var ms=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var ds=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var m=data.month,y=data.year,first=new Date(y,m-1,1).getDay(),total=new Date(y,m,0).getDate();
  var tn=new Date(),td=y===tn.getFullYear()&&m===tn.getMonth()+1?tn.getDate():0;
  var em={};data.items.forEach(function(e){var d=parseInt((e.date||'').split('-')[2]);if(d){if(!em[d])em[d]=[];em[d].push(e);}});
  var hdrs=ds.map(function(d){return '<div class="cal-dh">'+d+'</div>';}).join('');
  var cells='';
  for(var i=0;i<first;i++) cells+='<div class="cal-cell"></div>';
  for(var d=1;d<=total;d++){
    var evts=(em[d]||[]).map(function(e){return '<div class="cal-evt" style="background:'+e.color+'22;color:'+e.color+'">'+e.title+'</div>';}).join('');
    cells+='<div class="cal-cell '+(d===td?'today-cell':'')+'"><div class="cal-num">'+d+'</div>'+evts+'</div>';
  }
  C('<div class="ph"><div><h1>Calendar</h1><p>Holidays, leave, events</p></div>'+(isA()?'<button class="btn btn-primary" onclick="openAddEvt()">+ Add Event</button>':'')+'</div>'+
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'+
    '<button class="btn btn-secondary btn-sm" onclick="S.cal.m--;if(S.cal.m<1){S.cal.m=12;S.cal.y--;}loadCal()">‹</button>'+
    '<span style="font-size:16px;font-weight:700">'+ms[m-1]+' '+y+'</span>'+
    '<button class="btn btn-secondary btn-sm" onclick="S.cal.m++;if(S.cal.m>12){S.cal.m=1;S.cal.y++;}loadCal()">›</button>'+
  '</div>'+
  '<div style="border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">'+
    '<div class="cal-hdr">'+hdrs+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
  '</div>'+
  '<div style="display:flex;gap:14px;margin-top:12px">'+
    '<span style="font-size:12px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#ef4444;border-radius:2px;display:inline-block"></span>Holiday</span>'+
    '<span style="font-size:12px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#3b82f6;border-radius:2px;display:inline-block"></span>Leave</span>'+
    '<span style="font-size:12px;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#8b5cf6;border-radius:2px;display:inline-block"></span>Event</span>'+
  '</div>');
}

'<div class="fgg"><label>Type</label><select id="ev-tp"><option>EVENT</option><option>ANNOUNCEMENT</option></select></div>'+f('Date','date','ev-dt','')+f('End Date','date','ev-ed','')+
'<div class="fgg fg-full"><label>Description</label><textarea id="ev-ds" rows="2"></textarea></div></div>',
'<button class="btn btn-secondary" onclick="cM()">Cancel</button><button class="btn btn-primary" onclick="submitEvt()">Add</button>');}

  if(!isA()){C('<div class="empty"><div class="ei">🔒</div><h3>Admin access required</h3></div>');return;}
  C('<div class="ph"><div><h1>Settings</h1><p>System configuration</p></div></div>'+
  '<div class="tabs"><div class="tab active" id="st-co" onclick="loadST(\'company\')">Company</div><div class="tab" id="st-us" onclick="loadST(\'users\')">Users</div><div class="tab" id="st-au" onclick="loadST(\'automation\')">Automation</div></div>'+
  '<div id="st-body"><div class="pg-load"><div class="spinner"></div></div></div>');
  loadST('company');
}
function loadST(t){
  document.querySelectorAll('[id^="st-"]').forEach(function(e){e.classList.remove('active');});
  var el=document.getElementById('st-'+t.substring(0,2));if(el)el.classList.add('active');
  if(t==='company'){
    google.script.run.withSuccessHandler(function(cfg){
      document.getElementById('st-body').innerHTML='<div class="card" style="max-width:580px"><div style="font-size:14px;font-weight:700;margin-bottom:16px">Company Settings</div>'+
        '<div class="fg2">'+fv('Company Name','text','cf-nm',cfg.COMPANY_NAME)+fv('Company Email','email','cf-em',cfg.COMPANY_EMAIL)+fv('City','text','cf-cy',cfg.COMPANY_CITY)+fv('Office Latitude','text','cf-la',cfg.OFFICE_LAT)+fv('Office Longitude','text','cf-lo',cfg.OFFICE_LON)+fv('Office Radius (m)','number','cf-ra',cfg.OFFICE_RADIUS_M)+fv('Work Start','time','cf-ws',cfg.WORK_START||'09:00')+fv('Work End','time','cf-we',cfg.WORK_END||'18:00')+fv('Payroll Cycle Day','number','cf-pd',cfg.PAYROLL_CYCLE_DAY)+fv('PF %','number','cf-pf',cfg.PF_PERCENT)+'</div>'+
        '<button class="btn btn-primary" style="margin-top:16px" onclick="saveSet()">Save Settings</button></div>';
    }).getSettings();
  } else if(t==='users'){
    google.script.run.withSuccessHandler(function(users){
      var rows=users.map(function(u){return '<tr><td style="font-weight:600">'+u.name+'</td><td style="font-size:12px">'+u.email+'</td><td><select data-uid="'+u.id+'" onchange="updRole(this)" style="border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px"><option '+(u.role==='SUPER_ADMIN'?'selected':'')+'>SUPER_ADMIN</option><option '+(u.role==='HR_ADMIN'?'selected':'')+'>HR_ADMIN</option><option '+(u.role==='MANAGER'?'selected':'')+'>MANAGER</option><option '+(u.role==='EMPLOYEE'?'selected':'')+'>EMPLOYEE</option><option '+(u.role==='INTERN'?'selected':'')+'>INTERN</option></select></td><td><span class="badge '+(u.isActive?'bgn':'bgr')+'">'+(u.isActive?'Active':'Inactive')+'</span></td></tr>';}).join('');
      document.getElementById('st-body').innerHTML='<div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }).getUsers();
  } else {
    document.getElementById('st-body').innerHTML='<div class="card" style="max-width:480px">'+
      '<div style="font-size:14px;font-weight:700;margin-bottom:14px">Automation Triggers</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
        '<div class="card card-sm"><b>🕐 Daily Attendance Check</b><div style="font-size:12px;color:var(--muted);margin-top:3px">9 AM daily — auto-marks absent employees</div></div>'+
        '<div class="card card-sm"><b>💰 Monthly Payroll Reminder</b><div style="font-size:12px;color:var(--muted);margin-top:3px">24th of month — reminds admin to run payroll</div></div>'+
        '<div class="card card-sm"><b>📊 Weekly Leave Report</b><div style="font-size:12px;color:var(--muted);margin-top:3px">Every Monday — pending approvals summary</div></div>'+
      '</div>'+
      '<button class="btn btn-primary" style="margin-top:16px" onclick="setTriggers()">⚙️ Create / Reset Triggers</button></div>';
  }
}
function saveSet(){google.script.run.withSuccessHandler(function(r){if(r.success)toast('Saved ✓','s');else toast(r.error,'e');}).withFailureHandler(err).saveSettings({COMPANY_NAME:v('cf-nm'),COMPANY_EMAIL:v('cf-em'),COMPANY_CITY:v('cf-cy'),OFFICE_LAT:v('cf-la'),OFFICE_LON:v('cf-lo'),OFFICE_RADIUS_M:v('cf-ra'),WORK_START:v('cf-ws'),WORK_END:v('cf-we'),PAYROLL_CYCLE_DAY:v('cf-pd'),PF_PERCENT:v('cf-pf')});}
function updRole(sel){google.script.run.withSuccessHandler(function(r){if(r.success)toast('Role updated','s');}).withFailureHandler(err).updateUserRole(sel.dataset.uid,sel.value);}
function setTriggers(){google.script.run.withSuccessHandler(function(r){toast(r.message,'s');}).withFailureHandler(err).createAllTriggers();}

// ── NOTIFICATIONS ──────────────────────────────────────────
function loadNotifs(){
  google.script.run.withSuccessHandler(function(notifs){
    var u=notifs.filter(function(n){return !n.read;}).length;
    var nb=document.getElementById('nb');if(nb){nb.textContent=u;nb.style.display=u>0?'flex':'none';}
    var h=notifs.length?notifs.map(function(n){return '<div class="notif-item '+(n.read?'':'unread')+'"><div class="ni-title">'+n.title+'</div><div class="ni-msg">'+n.message+'</div><div style="font-size:10px;color:var(--muted);margin-top:3px">'+n.createdAt+'</div></div>';}).join(''):'<div class="empty" style="padding:30px"><div class="ei">🔔</div><p>No notifications</p></div>';
    var nl=document.getElementById('notif-list');if(nl)nl.innerHTML=h;
  }).getMyNotifications();
}
function toggleNotif(){var p=document.getElementById('notif-panel');p.classList.toggle('open');if(p.classList.contains('open'))loadNotifs();}
function markRead(){google.script.run.withSuccessHandler(function(){loadNotifs();}).markNotificationsRead();}

// ── USER UI ────────────────────────────────────────────────
function setUser(u){
  if(!u)return;S.user=u;
  var ini=(u.name||'?')[0].toUpperCase();
  var av=document.getElementById('tb-av');if(av)av.textContent=ini;
  var nm=document.getElementById('tb-nm');if(nm)nm.textContent=u.name;
  var rl=document.getElementById('tb-rl');if(rl)rl.textContent=u.role.replace(/_/g,' ');
  var sb=document.getElementById('sb-user');if(sb)sb.innerHTML='<span style="color:#e5e7eb;font-size:12px;font-weight:500">'+u.name+'</span><br><span style="color:#4b4b4b;font-size:10px">'+u.role+'</span>';
}

// ── SEARCH ─────────────────────────────────────────────────
var _st;
function gSearch(q){clearTimeout(_st);if(q.length<2)return;_st=setTimeout(function(){if(S.page==='employees'){EF.search=q;loadEmps();}},400);}

// ── HELPERS ────────────────────────────────────────────────
function C(h){document.getElementById('main').innerHTML=h;}
function v(id){var e=document.getElementById(id);return e?e.value:'';}
function f(lbl,type,id,ph,req){return '<div class="fgg"><label>'+lbl+(req?' *':'')+'</label><input type="'+type+'" id="'+id+'" placeholder="'+(ph||'')+'"/></div>';}
function fv(lbl,type,id,val){return '<div class="fgg"><label>'+lbl+'</label><input type="'+type+'" id="'+id+'" value="'+(val||'')+'"/></div>';}
function sec(title,rows){return '<div class="card card-sm"><div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.07em">'+title+'</div>'+rows.map(function(r){return '<div class="info-row2"><div class="ir-lbl">'+r[0]+'</div><div class="ir-val">'+(r[1]||'—')+'</div></div>';}).join('')+'</div>';}
function sec2(title,rows){return '<div class="card card-sm"><div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.07em">'+title+'</div>'+rows.map(function(r){return '<div class="info-row2"><div class="ir-lbl">'+r[0]+'</div><div class="ir-val">'+(r[1]||'—')+'</div></div>';}).join('')+'</div>';}
function tab(id,lbl,active,onclick){return '<div class="tab '+(active===id?'active':'')+'" onclick="'+onclick+'">'+lbl+'</div>';}
function fd(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function fm(n){if(!n)return '—';return '₹'+parseFloat(n).toLocaleString('en-IN',{maximumFractionDigits:0});}
function bFor(s){var m={ACTIVE:'bgn',INACTIVE:'bgr',ONBOARDING:'bgb',OFFBOARDING:'bgy',ALUMNI:'bgp',PENDING:'bgy',APPROVED:'bgn',REJECTED:'bgr',CANCELLED:'bg',WITHDRAWN:'bg',COMPLETED:'bgn',IN_PROGRESS:'bgb',INITIATED:'bgy',PAID:'bgn',DRAFT:'bg',PROCESSING:'bgb',PRESENT:'bgn',ABSENT:'bgr',PRESENT_REMOTE:'bgb'};return '<span class="badge '+(m[s]||'bg')+'">'+s+'</span>';}
function oM(title,body,footer,wide){
  document.getElementById('mt').textContent=title;
  document.getElementById('mbody').innerHTML=body;
  document.getElementById('mfoot').innerHTML=footer||'';
  document.getElementById('mbox').style.width=wide?'820px':'600px';
  document.getElementById('mov').classList.add('open');
}
function cM(){document.getElementById('mov').classList.remove('open');}
function toast(msg,t){t=t||'i';var el=document.createElement('div');el.className='toast t'+t;el.innerHTML=(t==='s'?'✅':t==='e'?'❌':'ℹ️')+' '+msg;document.getElementById('toast-cnt').appendChild(el);setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(100%)';el.style.transition='all .3s';setTimeout(function(){el.remove();},300);},3500);}
function err(e){toast('Error: '+(e.message||e),'e');console.error(e);}

document.getElementById('mov').addEventListener('click',function(e){if(e.target===this)cM();});
document.addEventListener('click',function(e){
  var p=document.getElementById('notif-panel'),b=document.querySelector('.notif-btn');
  if(p&&p.classList.contains('open')&&!p.contains(e.target)&&b&&!b.contains(e.target))p.classList.remove('open');
});
</script>
</body>
